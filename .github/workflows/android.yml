name: Build LIAE Android APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Checkout LIAE-Android
      # --------------------------------------------------

      - name: Checkout LIAE-Android
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Java
      # --------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 3. Setup Gradle
      # --------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # --------------------------------------------------
      # 4. Download FULL ONNX from SAEHD-Android
      # --------------------------------------------------

      - name: Download full LIAE ONNX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "========================================"
          echo "DOWNLOADING FULL LIAE ONNX"
          echo "========================================"

          mkdir -p /tmp/liae_artifact

          gh run download 34077791427 \
            --repo ppriyesh129-afk/SAEHD-Android \
            --name LIAE_128_80_48_16_FP32_ONNX_FULL \
            --dir /tmp/liae_artifact

          echo
          echo "========================================"
          echo "DOWNLOADED FILES"
          echo "========================================"

          find /tmp/liae_artifact -type f -printf '%p %s bytes\n'


      # --------------------------------------------------
      # 5. Verify ONNX exists and is large
      # --------------------------------------------------

      - name: Verify full ONNX
        run: |
          MODEL="/tmp/liae_artifact/LIAE_128_80_48_16_fp32.onnx"

          echo "========================================"
          echo "VERIFYING ONNX"
          echo "========================================"

          if [ ! -f "$MODEL" ]; then
            echo "ERROR: ONNX file not found"
            find /tmp/liae_artifact -type f -print
            exit 1
          fi

          SIZE=$(stat -c%s "$MODEL")

          echo "ONNX size: $SIZE bytes"

          if [ "$SIZE" -lt 10000000 ]; then
            echo "ERROR: ONNX is suspiciously small"
            exit 1
          fi

          echo "✓ FULL ONNX FOUND"


      # --------------------------------------------------
      # 6. Verify graph inputs
      # --------------------------------------------------

      - name: Verify ONNX graph
        env:
          MODEL: /tmp/liae_artifact/LIAE_128_80_48_16_fp32.onnx
        run: |
          python -m pip install --disable-pip-version-check \
            "onnx==1.16.2"

          python - <<'PY'
          import os
          import onnx

          path = os.environ["MODEL"]

          print("========================================")
          print("CHECKING ONNX GRAPH")
          print("========================================")

          model = onnx.load(path)

          inputs = [x.name for x in model.graph.input]

          print("Inputs:")
          for name in inputs:
              print(" -", name)

          outputs = [x.name for x in model.graph.output]

          print()
          print("Outputs:")
          for name in outputs:
              print(" -", name)

          print()

          if set(inputs) != {"src", "dst"}:
              raise RuntimeError(
                  "INVALID GRAPH INPUTS: " + str(inputs)
              )

          print("✓ ONLY src AND dst ARE GRAPH INPUTS")
          PY


      # --------------------------------------------------
      # 7. Copy REAL ONNX into Android assets
      # --------------------------------------------------

      - name: Install ONNX into Android assets
        run: |
          echo "========================================"
          echo "INSTALLING ONNX"
          echo "========================================"

          mkdir -p app/src/main/assets

          rm -f \
            app/src/main/assets/LIAE_128_80_48_16_fp32.onnx

          cp \
            /tmp/liae_artifact/LIAE_128_80_48_16_fp32.onnx \
            app/src/main/assets/LIAE_128_80_48_16_fp32.onnx

          echo
          echo "=== ANDROID ASSET ==="

          ls -lh \
            app/src/main/assets/LIAE_128_80_48_16_fp32.onnx


      # --------------------------------------------------
      # 8. Final asset verification
      # --------------------------------------------------

      - name: Verify Android model asset
        run: |
          MODEL="app/src/main/assets/LIAE_128_80_48_16_fp32.onnx"

          SIZE=$(stat -c%s "$MODEL")

          echo "========================================"
          echo "FINAL MODEL"
          echo "========================================"

          echo "Path: $MODEL"
          echo "Size: $SIZE bytes"

          if [ "$SIZE" -lt 10000000 ]; then
            echo "ERROR: Bad ONNX asset"
            exit 1
          fi

          echo "✓ REAL LIAE ONNX IS IN ANDROID ASSETS"


      # --------------------------------------------------
      # 9. Build APK
      # --------------------------------------------------

      - name: Build Debug APK
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug


      # --------------------------------------------------
      # 10. Show APK size
      # --------------------------------------------------

      - name: Check APK
        run: |
          echo "========================================"
          echo "APK"
          echo "========================================"

          ls -lh app/build/outputs/apk/debug/app-debug.apk


      # --------------------------------------------------
      # 11. Upload APK
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIAE-Android-debug-FULL-ONNX
          path: app/build/outputs/apk/debug/app-debug.apk
