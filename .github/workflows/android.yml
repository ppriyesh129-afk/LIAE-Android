name: Build LIAE Android APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout LIAE-Android
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Download Full LIAE ONNX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/liae_artifact

          gh run download 34077791427 \
            --repo ppriyesh129-afk/SAEHD-Android \
            --name LIAE_128_80_48_16_FP32_ONNX_FULL \
            --dir /tmp/liae_artifact

      - name: Verify ONNX
        run: |
          MODEL="/tmp/liae_artifact/LIAE_128_80_48_16_fp32.onnx"

          test -f "$MODEL"

          SIZE=$(stat -c%s "$MODEL")

          echo "Model size: $SIZE bytes"

          if [ "$SIZE" -lt 10000000 ]; then
            echo "Invalid ONNX"
            exit 1
          fi

      - name: Verify Graph
        env:
          MODEL: /tmp/liae_artifact/LIAE_128_80_48_16_fp32.onnx
        run: |
          python -m pip install --disable-pip-version-check onnx==1.16.2

          python - <<'PY'
          import os
          import onnx

          model = onnx.load(os.environ["MODEL"])

          print("Inputs:", [i.name for i in model.graph.input])
          print("Outputs:", [o.name for o in model.graph.output])
          PY

      - name: Install Model into Assets
        run: |
          mkdir -p app/src/main/assets

          cp \
            /tmp/liae_artifact/LIAE_128_80_48_16_fp32.onnx \
            app/src/main/assets/LIAE_128_80_48_16_fp32.onnx

      - name: Build Debug APK
        run: |
          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIAE-Android-debug-FULL-ONNX
          path: app/build/outputs/apk/debug/app-debug.apk
