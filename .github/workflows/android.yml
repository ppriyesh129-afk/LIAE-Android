name: Build LIAE Android APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout LIAE-Android
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7

      # ============================================
      # DOWNLOAD FULL LIAE MODEL
      # ============================================

      - name: Download Full LIAE ONNX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "========================================"
          echo "DOWNLOADING FULL LIAE ONNX"
          echo "========================================"

          mkdir -p /tmp/liae_artifact

          gh run download 34077791427 \
            --repo ppriyesh129-afk/SAEHD-Android \
            --name LIAE_128_80_48_16_FP32_ONNX_FULL \
            --dir /tmp/liae_artifact

          echo
          echo "Downloaded files:"
          find /tmp/liae_artifact -type f -printf '%p %s bytes\n'

      # ============================================
      # VERIFY LIAE
      # ============================================

      - name: Verify LIAE ONNX
        run: |
          MODEL="/tmp/liae_artifact/LIAE_128_80_48_16_fp32.onnx"

          test -f "$MODEL"

          SIZE=$(stat -c%s "$MODEL")

          echo "LIAE model size: $SIZE bytes"

          if [ "$SIZE" -lt 10000000 ]; then
            echo "ERROR: LIAE model is suspiciously small"
            exit 1
          fi

          echo "✓ FULL LIAE ONNX FOUND"

      # ============================================
      # VERIFY GRAPH
      # ============================================

      - name: Verify LIAE Graph
        env:
          MODEL: /tmp/liae_artifact/LIAE_128_80_48_16_fp32.onnx
        run: |
          python -m pip install \
            --disable-pip-version-check \
            "onnx==1.16.2"

          python - <<'PY'
          import os
          import onnx

          model = onnx.load(os.environ["MODEL"])

          inputs = [x.name for x in model.graph.input]
          outputs = [x.name for x in model.graph.output]

          print("========================================")
          print("LIAE GRAPH")
          print("========================================")
          print("Inputs :", inputs)
          print("Outputs:", outputs)

          if set(inputs) != {"src", "dst"}:
              raise RuntimeError(
                  "Unexpected inputs: " + str(inputs)
              )

          print()
          print("✓ LIAE INPUTS VERIFIED")
          PY

      # ============================================
      # INSTALL LIAE
      # ============================================

      - name: Install LIAE Model into Assets
        run: |
          echo "========================================"
          echo "INSTALLING LIAE MODEL"
          echo "========================================"

          mkdir -p app/src/main/assets

          cp \
            /tmp/liae_artifact/LIAE_128_80_48_16_fp32.onnx \
            app/src/main/assets/LIAE_128_80_48_16_fp32.onnx

          ls -lh app/src/main/assets/LIAE_128_80_48_16_fp32.onnx

          echo "✓ LIAE INSTALLED"

      # ============================================
      # DOWNLOAD BLAZEFACE
      # ============================================

      - name: Download BlazeFace Detector
        run: |
          echo "========================================"
          echo "DOWNLOADING BLAZEFACE"
          echo "========================================"

          mkdir -p app/src/main/assets

          wget --no-verbose \
            -O app/src/main/assets/blazeface.onnx \
            "https://github.com/yakhyo/mediapipe-face-mesh-onnx/releases/download/weights/face_detection_short_range.onnx"

          test -f app/src/main/assets/blazeface.onnx

          SIZE=$(stat -c%s app/src/main/assets/blazeface.onnx)

          echo "BlazeFace size: $SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: BlazeFace download failed"
            exit 1
          fi

          echo "✓ BLAZEFACE DOWNLOADED"

      # ============================================
      # VERIFY BOTH MODELS
      # ============================================

      - name: Verify Android Model Assets
        run: |
          echo "========================================"
          echo "ANDROID MODEL ASSETS"
          echo "========================================"

          ls -lh app/src/main/assets/

          echo

          test -f app/src/main/assets/LIAE_128_80_48_16_fp32.onnx
          test -f app/src/main/assets/blazeface.onnx

          echo "✓ LIAE MODEL PRESENT"
          echo "✓ BLAZEFACE MODEL PRESENT"

      # ============================================
      # BUILD APK
      # ============================================

      - name: Build Debug APK
        run: |
          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================
      # VERIFY APK
      # ============================================

      - name: Check APK
        run: |
          echo "========================================"
          echo "APK"
          echo "========================================"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

          echo "✓ APK BUILD SUCCESSFUL"

      # ============================================
      # UPLOAD APK
      # ============================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIAE-Android-debug-BlazeFace
          path: app/build/outputs/apk/debug/app-debug.apk
